# Dependabot: automated dependency and GitHub Actions updates.
#
# Update PRs go through the normal CI gates, including the MSRV (Rust 1.80)
# job and cargo-deny, so a bump that needs a newer compiler or pulls in a
# denied license/advisory is caught before merge.
version: 2
updates:
  # Root crate (and the workspace path crates it depends on).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch routine minor/patch bumps into one PR to limit review noise.
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Remaining exact pins in Cargo.toml (justified next to each `=` entry).
      # Caret-ranged crates (clap, toml, colored, dirs, clap_complete) may update.
      - dependency-name: clap_mangen
      - dependency-name: comfy-table
      - dependency-name: stellar-strkey
      - dependency-name: zxcvbn
      # time >= 0.3.46 requires Rust 1.88, above our 1.80 MSRV (see deny.toml).
      - dependency-name: time
        versions: [">= 0.3.46"]

  # Fuzz harnesses have their own lockfile.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  # Registry API (Node).
  - package-ecosystem: npm
    directory: /registry-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Pinned action versions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
