name: Fuzz Corpus Refresh

on:
  # Weekly Monday refresh to keep corpora lean
  schedule:
    - cron: '0 2 * * 1'

  # Allow manual dispatch for ad-hoc refresh
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no deletions)'
        required: false
        default: 'true'

# Only one concurrent refresh per branch
concurrency:
  group: corpus-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus-hygiene:
    name: Fuzz Corpus Hygiene Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Run corpus hygiene check
        run: |
          chmod +x ./scripts/corpus-hygiene.sh
          ./scripts/corpus-hygiene.sh --all --dry-run
        shell: bash

      - name: Deduplicate corpus (if not dry-run and on schedule)
        if: github.event_name == 'schedule'
        run: |
          chmod +x ./scripts/corpus-hygiene.sh
          ./scripts/corpus-hygiene.sh --dedupe
        shell: bash

      - name: Collect corpus statistics
        run: |
          chmod +x ./scripts/corpus-hygiene.sh
          ./scripts/corpus-hygiene.sh --stats > corpus-stats.txt
          cat corpus-stats.txt
        shell: bash

      - name: Upload corpus statistics
        uses: actions/upload-artifact@v4
        with:
          name: corpus-statistics
          path: corpus-stats.txt
          retention-days: 90

      - name: Comment PR with corpus stats (if dry-run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stats = fs.readFileSync('corpus-stats.txt', 'utf-8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Fuzz Corpus Statistics (Dry-Run)\n\n\`\`\`\n${stats}\n\`\`\``
            });

      - name: Commit corpus changes (if not dry-run and deduplicated)
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet fuzz/corpus; then
            echo "No changes to commit"
          else
            git add fuzz/corpus/
            git commit -m "chore: deduplicate fuzz corpus entries"
          fi
        shell: bash

      - name: Push changes (if any)
        if: github.event_name == 'schedule'
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
