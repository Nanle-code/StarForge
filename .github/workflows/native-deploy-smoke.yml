# Native deploy / SAC regression tests (#905 / #909)

name: Native deploy smoke

on:
  pull_request:
    paths:
      - "src/utils/soroban_native.rs"
      - "src/commands/deploy.rs"
      - "src/commands/asset.rs"
      - "src/utils/soroban.rs"
      - "tests/sac_contract_id.rs"
      - "tests/watch_only_wallet.rs"
      - ".github/workflows/native-deploy-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    name: SAC + watch-only tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: SAC contract-id fixtures
        run: cargo test --locked --test sac_contract_id
      - name: Watch-only wallet CLI
        run: cargo test --locked --test watch_only_wallet
      - name: Native deploy unit tests
        run: cargo test --locked soroban_native::
