[package]
name = "starforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A developer productivity CLI for Stellar and Soroban workflows"
license = "MIT"
repository = "https://github.com/Josetic224/StarForge"
homepage = "https://github.com/Josetic224/StarForge"
documentation = "https://docs.rs/starforge"
keywords = ["stellar", "soroban", "blockchain", "cli", "web3"]

[[bin]]
name = "starforge"
path = "src/main.rs"

[lib]
name = "starforge"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Package-wide lint policy. These lints are intentionally relaxed for the crate
# (including integration tests, which use lightweight mock structs and helpers).
# Centralizing them here keeps `cargo clippy --all-targets -- -D warnings` green.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"

[lints.clippy]
needless_range_loop = "allow"
redundant_closure = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_lazy_evaluations = "allow"
items_after_test_module = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
empty_line_after_doc_comments = "allow"
doc_overindented_list_items = "allow"
expect_fun_call = "allow"
useless_vec = "allow"
single_match = "allow"

[dependencies]
clap     = { version = "=4.4.18", features = ["derive", "color"] }
serde    = { version = "1.0",     features = ["derive"] }
serde_json = "1.0"
regex    = "1.10"
toml     = "=0.8.8"
semver   = "1.0"
colored  = "=2.1.0"
comfy-table  = "7.1.1"
dirs     = "=5.0.1"
anyhow   = "1.0"
thiserror = "1.0"
chrono   = { version = "0.4", features = ["serde"] }
rand     = "0.8"
ed25519-dalek = ">=2.1.1, <3"
reqwest    = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio      = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
ctrlc      = "3.4"
clap_complete  = "=4.4.10"
dialoguer  = { version = "0.11", features = ["fuzzy-select", "password"] }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
stellar-strkey = "=0.0.9"
stellar-xdr = { version = "22.0.0", features = ["serde"] }
base64     = "0.21"
urlencoding = "2.1"
sha2 = "0.10"
indicatif = "0.17.7"
libloading = "0.8.1"
uuid = { version = "1.6.1", features = ["v4", "serde"] }
hidapi = { version = "2.6.5", optional = true }
trezor-client = { version = "0.1.5", default-features = false, features = ["stellar"], optional = true }
zxcvbn = "=3.1.0"
hex = "0.4"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
bip39 = { version = "2", features = ["rand", "std"] }
hmac = "0.12"
rustyline = "14.0.0"
zip = "0.6"
tempfile = "3.8"
wasm-bindgen = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
csv = "1.0"
minijinja = "1.0"
serde_yaml = "0.9.34"
async-trait = "0.1"
futures = "0.3.33"

[features]
hardware-wallet = ["dep:hidapi", "dep:trezor-client"]
memory-profiling = []

[dev-dependencies]
criterion = "0.5.1"
tempfile = "3.8"
mockito = "1.2"
wasm-bindgen-test = "0.3"
# Property-based testing
proptest = "1.4"
# Arbitrary trait for structured fuzzing
arbitrary = { version = "1.3", features = ["derive"] }
# Soroban SDK (testutils only) for tests that exercise `#[contracttype]` enum
# discriminants on the included fixtures under `tests/fixtures/`.
# Pulled in for `tests/discriminant_uniqueness.rs`, which guards against
# accidental discriminant reuse when adding a new variant.
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true

[build-dependencies]
clap = { version = "4.4.18", features = ["derive"] }
clap_complete = "4.4.10"
clap_mangen = "=0.2.21"
