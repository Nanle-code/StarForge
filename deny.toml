# cargo-deny configuration for StarForge
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
ignore = [
    # rustls-webpki 0.100/0.101 pulled in transitively via pinned ureq =2.7.1.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # number_prefix unmaintained; pulled in via indicatif. No safe upgrade.
    "RUSTSEC-2025-0119",
    # derivative + paste unmaintained; both are build-time proc-macros reached
    # through ark-ec / ark-ff under the soroban-sdk dev-dependency. Dev-only and
    # not linked into the shipped binary; no upgrade path until soroban-sdk moves.
    "RUSTSEC-2024-0388",
    "RUSTSEC-2024-0436",
    # rustls-pemfile unmaintained in 1.0.4; reqwest 0.11 requires it.
    # Superseded in reqwest 0.12, which is a breaking change for this crate.
    "RUSTSEC-2025-0134",
    # h2 unbounded empty DATA frames (CVSS low). Both h2 0.3.x (via reqwest 0.11
    # -> hyper 0.14) and h2 0.4.x (via mockito dev dep -> hyper 1.x) are
    # affected. Upgrading reqwest to 0.12+ is a breaking-change migration;
    # tracked separately. The mock-only h2 0.4 path carries no production risk.
    "RUSTSEC-2026-0258",
    # time RFC 2822 stack exhaustion. Fixed in time 0.3.47, but every release
    # from 0.3.46 on declares rust-version 1.88, which is incompatible with this
    # crate's MSRV of 1.80 (enforced by the `MSRV (Rust 1.80)` CI job). The
    # vulnerable path is RFC 2822 parsing of untrusted input, which StarForge
    # never performs: there is no rfc2822 call anywhere in the tree, and the
    # three consumers do not parse it either (tracing-appender formats log
    # timestamps, zip reads MS-DOS date fields, zxcvbn does date matching).
    # Revisit if the MSRV moves to 1.88 or these deps drop `time`.
    "RUSTSEC-2026-0009",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# ring 0.16.x has no license field; clarify it manually.
[[licenses.clarify]]
name = "ring"
version = "=0.16.20"
expression = "OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
