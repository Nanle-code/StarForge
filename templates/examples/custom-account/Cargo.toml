[package]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
# Real signatures, not mocked ones: the ed25519 and secp256r1 paths hash their
# payload differently, and only a real signature proves the account verifies
# each one against the message the signer actually signed.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = "0.10"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
